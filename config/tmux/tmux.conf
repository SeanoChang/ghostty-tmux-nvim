# ~/.config/tmux/tmux.conf
# target: tmux 3.5+ (3.7b recommended), macOS, Ghostty, neovim, Claude Code
# reload: prefix + r


# ─────────────────────────────────────────────────────────────
# 1. terminal contract  (Ghostty <-> tmux <-> nvim)
#    everything here exists to stop tmux from degrading nvim
# ─────────────────────────────────────────────────────────────

set  -g default-terminal "tmux-256color"
set  -as terminal-features ",xterm-256color:RGB"    # truecolor passthrough
set  -as terminal-features ",*:usstyle"             # undercurl + colored underlines (LSP diagnostics)
set  -as terminal-features "xterm*:extkeys"         # CSI u extended keys
set  -s  extended-keys on                           # Shift+Enter, Ctrl+;, etc. reach the program

set  -g allow-passthrough on                        # kitty graphics for snacks.image
set  -g set-clipboard on                            # OSC 52: yank in nvim over SSH -> mac clipboard
set  -s escape-time 10                              # nvim ESC latency (default since 3.5, kept explicit)
set  -g focus-events on                             # nvim autoread + lualine focus events

set  -ga update-environment TERM
set  -ga update-environment TERM_PROGRAM

# macOS PATH fix: a login shell re-runs /etc/zprofile -> path_helper reorders PATH
# and homebrew ends up behind /usr/bin. Non-login shell skips that.
set  -g default-command "${SHELL}"


# ─────────────────────────────────────────────────────────────
# 2. behaviour
# ─────────────────────────────────────────────────────────────

# C-Space is tempting but collides with macOS "select previous input source"
# which matters if you switch to 注音/拼音. C-a is the safe pick.
unbind C-b
set  -g prefix C-a
bind C-a send-prefix

set  -g mouse on
set  -g history-limit 100000
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g detach-on-destroy off       # killing a session hops to another instead of dropping you out
set  -g status-interval 5
set  -g display-time 2000
setw -g mode-keys vi
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# bell: Claude Code rings the terminal bell when it finishes / needs input.
# this turns that into a visible flag on the window in the status bar.
set  -g monitor-bell on
set  -g visual-bell off
set  -g bell-action other


# ─────────────────────────────────────────────────────────────
# 3. keys
# ─────────────────────────────────────────────────────────────

bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

# splits inherit cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"
unbind '"'
unbind %

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind z resize-pane -Z
bind Space last-window
bind Tab   switch-client -l
bind e setw synchronize-panes \; display-message "sync #{?pane_synchronized,on,off}"
bind C-l send-keys 'C-l'            # prefix C-l still clears the screen


# ── seamless nvim <-> tmux pane movement ──
# C-hjkl moves between nvim splits and tmux panes without thinking about
# which one you're in. Works today because lua/config/keymaps.lua maps
# C-hjkl to <C-w>hjkl inside nvim. Install christoomey/vim-tmux-navigator
# on the nvim side if you also want to step OUT of nvim's edge split.

is_vim="ps -o state=,comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?)(diff)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R


# ── copy mode (vi) ──
bind Escape copy-mode
bind -T copy-mode-vi v    send -X begin-selection
bind -T copy-mode-vi C-v  send -X rectangle-toggle
bind -T copy-mode-vi y    send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y    send -X copy-pipe-and-cancel "pbcopy; tmux paste-buffer"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"

# jump between shell prompts (needs OSC 133 marking — p10k emits it)
bind -T copy-mode-vi '[' send -X previous-prompt
bind -T copy-mode-vi ']' send -X next-prompt


# ─────────────────────────────────────────────────────────────
# 4. popups  (the single biggest "fancy" upgrade)
#    display-popup floats a real terminal over the layout.
# ─────────────────────────────────────────────────────────────

bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind f display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "yazi"

# scratch session that follows you between projects
bind t display-popup -w 70% -h 70% -E "tmux new-session -A -s scratch"

# session picker: running sessions + zoxide dirs, fuzzy-found in a popup.
# needs `brew install joshmedeski/sesh/sesh` and zoxide already set up.
bind s run-shell "sesh connect \"\$(sesh list | fzf-tmux -p 60%,60% --no-sort --prompt 'session > ')\""


# ─────────────────────────────────────────────────────────────
# 5. Claude Code
# ─────────────────────────────────────────────────────────────

# agent pane beside your editor
bind a split-window -h -l 45% -c "#{pane_current_path}" "claude"
# agent in its own window (better for long autonomous runs — the bell flag
# shows up in the status bar while you work elsewhere)
bind A new-window -n claude -c "#{pane_current_path}" "claude"
# throwaway agent in a popup, dies when you close it
bind C display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "claude"


# ─────────────────────────────────────────────────────────────
# 6. status bar — TokyoNight Moon, orange accent
#    orange (not blue) so it reads distinct from lualine's blue
#    statusline inside Neovim. Set status-position to `top` if you
#    prefer it above the panes.
# ─────────────────────────────────────────────────────────────

%hidden BG="#2f334d"    # moon bg_highlight
%hidden FG="#828bb8"    # moon fg_dark
%hidden DIM="#444a73"   # moon fg_gutter
%hidden TXT="#c8d3f5"   # moon fg
%hidden ACC="#ff966c"   # moon orange
%hidden INV="#1e2030"   # moon bg_dark — text on top of ACC
%hidden WARN="#ffc777"  # moon yellow

set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "bg=$BG,fg=$FG"
set -g status-left-length  40
set -g status-right-length 80

set -g status-left  "#[fg=$ACC,bold]  #S #[fg=$DIM]│"
set -g status-right "#[fg=$ACC]#{?client_prefix,● ,}#[fg=$FG]#{b:pane_current_path} #[fg=$DIM]│#[fg=$FG] %H:%M  "

set -g window-status-separator ""
set -g window-status-format         "#[fg=$DIM] #I #[fg=$FG]#W "
set -g window-status-current-format "#[fg=$INV,bg=$ACC,bold] #I #W "
set -g window-status-bell-style     "fg=$WARN,nobold"

set -g message-style "bg=$ACC,fg=$INV"
set -g mode-style    "bg=$DIM,fg=$TXT"

set -g pane-border-lines single
set -g pane-border-style        "fg=$BG"
set -g pane-active-border-style "fg=$ACC"
set -g display-panes-colour        "$DIM"
set -g display-panes-active-colour "$ACC"


# ─────────────────────────────────────────────────────────────
# 7. version-gated goodies (3.6 / 3.7)
# ─────────────────────────────────────────────────────────────

if -F "#{m:3.[6-9]*,#{version}}" {
    set -g pane-scrollbars on
    set -g pane-scrollbars-position right
    set -g pane-scrollbars-style "bg=default,fg=$DIM"
    set -g copy-mode-selection-style "bg=$DIM,fg=$TXT"
    set -g copy-mode-position-style  "bg=default,fg=$FG"
}

if -F "#{m:3.[7-9]*,#{version}}" {
    set -g copy-mode-line-numbers hybrid
    set -g copy-mode-line-number-style "fg=$DIM"
}


# ─────────────────────────────────────────────────────────────
# 8. plugins (tpm)
#    install: git clone https://github.com/tmux-plugins/tpm \
#               ~/.config/tmux/plugins/tpm
#    then: prefix + I
#
#    deliberately NOT using tmux-sensible — it silently overrides
#    escape-time and default-terminal set above.
# ─────────────────────────────────────────────────────────────

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

run '~/.config/tmux/plugins/tpm/tpm'
